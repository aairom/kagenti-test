                - generic [ref=e767]:
                  - heading "Why Kagenti?" [level=2] [ref=e768]
                  - 'link "Permalink: Why Kagenti?" [ref=e769] [cursor=pointer]':
                    - /url: "#why-kagenti"
                    - img [ref=e770]
                - paragraph [ref=e772]: "Despite the extensive variety of frameworks available for developing agent-based applications (LangGraph, CrewAI, AG2, etc.), there is a distinct lack of standardized methods for deploying and operating agent code in production environments. Agents are adept at reasoning, planning, and interacting with tools, but their full potential is often limited by:"
                - list [ref=e773]:
                  - listitem [ref=e774]:
                    - strong [ref=e775]: Deployment Complexity
                    - text: "- Each framework requires custom deployment scripts and infrastructure"
                  - listitem [ref=e776]:
                    - strong [ref=e777]: Security Gaps
                    - text: "- No standardized approach to authentication, authorization, and workload identity"
                  - listitem [ref=e778]:
                    - strong [ref=e779]: Protocol Fragmentation
                    - text: "- Agents and tools use different communication patterns"
                  - listitem [ref=e780]:
                    - strong [ref=e781]: Operational Overhead
                    - text: "- Scaling, monitoring, and lifecycle management require custom solutions"
                - paragraph [ref=e782]: Kagenti addresses these challenges by enhancing existing agent frameworks with production-ready, framework-neutral infrastructure.
                - generic [ref=e783]:
                  - heading "Supported AI Use‑Case Types" [level=2] [ref=e784]
                  - 'link "Permalink: Supported AI Use‑Case Types" [ref=e785] [cursor=pointer]':
                    - /url: "#supported-ai-usecase-types"
                    - img [ref=e786]
                - paragraph [ref=e788]: Kagenti is designed to support a broad range of AI‑agent deployment patterns, including knowledge services, synchronous and asynchronous user‑authorized assistants, continuous monitoring agents, and event‑driven workflows.
                - paragraph [ref=e789]:
                  - text: See the full list and definitions in the
                  - strong [ref=e790]:
                    - link "Kagenti Use Cases" [ref=e791] [cursor=pointer]:
                      - /url: /kagenti/kagenti/blob/main/docs/use-case-types.md
                  - text: document.
                - generic [ref=e792]:
                  - heading "Architecture" [level=2] [ref=e793]
                  - 'link "Permalink: Architecture" [ref=e794] [cursor=pointer]':
                    - /url: "#architecture"
                    - img [ref=e795]
                - paragraph [ref=e797]: "The goal of Kagenti is to provide a pluggable agentic platform blueprint. Key functionalities are currently organized into four key pillars:"
                - list [ref=e798]:
                  - listitem [ref=e799]: Lifecycle Orchestration
                  - listitem [ref=e800]: Networking
                  - listitem [ref=e801]: Security
                  - listitem [ref=e802]: Observability
                - paragraph [ref=e803]: Under each of these pillars are logical components that support the workload runtime.
