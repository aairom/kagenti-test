[project]
name = "hello-kagenti-agent"
version = "1.0.0"
description = "A simple A2A greeting agent for the Kagenti platform."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.1.0,<2",
    "openai>=2.41.1",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.34.0",
]

[project.scripts]
server = "hello_agent.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_agent"]
